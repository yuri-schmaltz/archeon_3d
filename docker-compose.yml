# =============================================================================
# PolyForge — full stack (Do prompt ao polígono)
# =============================================================================
# Brings up:
#   - api      : the FastAPI backend (with the Hunyuan3D model worker)
#   - frontend : the Vite/React UI, served by nginx, proxies /v1 to api
#   - (optional) caddy : TLS terminator + public hostname, off by default
#
# Quick start:
#   cp .env.example .env
#   # edit .env to set POLYFORGE_API_KEY, POLYFORGE_DEVICE, etc.
#   docker compose up --build
# =============================================================================

name: polyforge

x-backend-env: &backend-env
  POLYFORGE_HOST: 0.0.0.0
  POLYFORGE_PORT: 8081
  # If you have an NVIDIA GPU, the api service uses the cuda base image.
  # On CPU-only hosts, set POLYFORGE_DEVICE=cpu (or rely on the env var).
  POLYFORGE_DEVICE: ${POLYFORGE_DEVICE:-cuda}
  POLYFORGE_MODEL: ${POLYFORGE_MODEL:-tencent/Hunyuan3D-2}
  POLYFORGE_MODEL_SUBFOLDER: ${POLYFORGE_MODEL_SUBFOLDER:-hunyuan3d-dit-v2-0}
  POLYFORGE_MULTIVIEW_MODEL: ${POLYFORGE_MULTIVIEW_MODEL:-tencent/Hunyuan3D-2mv}
  POLYFORGE_MULTIVIEW_SUBFOLDER: ${POLYFORGE_MULTIVIEW_SUBFOLDER:-hunyuan3d-dit-v2-mv}
  POLYFORGE_MAX_HISTORY: ${POLYFORGE_MAX_HISTORY:-1000}
  POLYFORGE_MAX_AGE_SECONDS: ${POLYFORGE_MAX_AGE_SECONDS:-86400}
  POLYFORGE_MAX_QUEUE_SIZE: ${POLYFORGE_MAX_QUEUE_SIZE:-4}
  # Compose refuses to start without an API key; local non-Docker dev may omit it.
  POLYFORGE_API_KEY: "${POLYFORGE_API_KEY:?Set POLYFORGE_API_KEY in .env before starting Compose}"
  POLYFORGE_CORS_ORIGINS: ${POLYFORGE_CORS_ORIGINS:-http://localhost}
  # Where generated meshes go (mounted as a volume so they survive restarts).
  POLYFORGE_SAVE_DIR: /data/meshes
  # SQLite-backed persistence.
  POLYFORGE_JOB_DB: /data/state/jobs.db
  # Optional file log.
  POLYFORGE_LOG_FILE: /data/logs/polyforge-api.log
  POLYFORGE_LOG_LEVEL: ${POLYFORGE_LOG_LEVEL:-INFO}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: polyforge-api:local
    container_name: polyforge-api
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - polyforge-data:/data
      # If you already have models downloaded, mount your HF cache here.
      - ${HF_HOME:-./.hf-cache}:/root/.cache/huggingface
    ports:
      # Host access is loopback-only; use a TLS reverse proxy for public access.
      - "127.0.0.1:${POLYFORGE_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s  # model load can be slow on first run
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    image: polyforge-frontend:local
    container_name: polyforge-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  # Optional: TLS terminator. Uncomment to enable.
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: polyforge-caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   depends_on:
  #     - frontend

volumes:
  polyforge-data:
    # Persistent state (meshes, SQLite DB, logs).
  # caddy-data:
  # caddy-config:
