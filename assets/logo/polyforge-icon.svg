<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>PolyForge</title>
  <!-- Warm off-black forge plate -->
  <rect width="256" height="256" rx="56" fill="#0d0c0a"/>
  <rect x="6" y="6" width="244" height="244" rx="51" fill="none" stroke="#2a2722" stroke-width="3"/>
  <!-- Hexagonal forge ring -->
  <path d="M128 38 L208 84 L208 172 L128 218 L48 172 L48 84 Z" fill="none" stroke="#e8e4dc" stroke-width="9" stroke-linejoin="round"/>
  <!-- Low-poly "P": vertical stem + bowl, faceted -->
  <path d="M94 168 L94 88 L156 88 L156 128 L94 128" fill="none" stroke="#e8e4dc" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Facet lines -->
  <path d="M94 128 L156 88 M94 88 L125 128" stroke="#3a3630" stroke-width="4" stroke-linecap="round"/>
  <!-- Forge spark -->
  <circle cx="170" cy="162" r="17" fill="#ff6a00"/>
  <circle cx="170" cy="162" r="24" fill="none" stroke="#ff6a00" stroke-width="4" opacity="0.45"/>
</svg>
